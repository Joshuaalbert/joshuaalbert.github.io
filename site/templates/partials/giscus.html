<section class="comments" aria-label="Comments and reactions">
  {% if site.giscus.configured %}
    <script src="https://giscus.app/client.js"
      data-repo="{{ site.giscus.repo }}"
      data-repo-id="{{ site.giscus.repo_id }}"
      data-category="{{ site.giscus.category }}"
      data-category-id="{{ site.giscus.category_id }}"
      data-mapping="specific"
      data-term="{{ photo.giscus_term if photo is defined else item.giscus_term }}"
      data-strict="1"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="{{ site.giscus.theme }}"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  {% else %}
    <p class="comments-placeholder">GitHub comments and reactions will appear here after giscus is configured.</p>
  {% endif %}
</section>
